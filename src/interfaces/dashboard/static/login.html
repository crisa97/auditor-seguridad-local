<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self';">
    <title>Dashboard - Seguridad Local</title>
    <link rel="stylesheet" href="/dashboard/css/style.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <h1>Dashboard de Seguridad</h1>
            <p>Inicia sesión para acceder al panel de monitoreo</p>
            <div id="alert-container"></div>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required autocomplete="email" placeholder="admin@seguridad.local">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;justify-content:center;padding:12px;" id="btn-login">Iniciar Sesión</button>
            </form>
        </div>
    </div>

    <script>
        const API_BASE = '/api/v2';

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn-login');
            const alertContainer = document.getElementById('alert-container');
            alertContainer.innerHTML = '';
            btn.disabled = true;
            btn.textContent = 'Iniciando sesión...';

            try {
                const res = await fetch(`${API_BASE}/auth/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        email: document.getElementById('email').value,
                        password: document.getElementById('password').value,
                    }),
                });

                if (!res.ok) {
                    const err = await res.json().catch(() => ({ detail: 'Error de conexión' }));
                    throw new Error(err.detail || 'Credenciales inválidas');
                }

                const data = await res.json();
                sessionStorage.setItem('access_token', data.access_token);
                sessionStorage.setItem('refresh_token', data.refresh_token);
                sessionStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = '/dashboard/';
            } catch (e) {
                alertContainer.innerHTML = `<div class="alert alert-error">${e.message}</div>`;
            } finally {
                btn.disabled = false;
                btn.textContent = 'Iniciar Sesión';
            }
        });
    </script>
</body>
</html>
