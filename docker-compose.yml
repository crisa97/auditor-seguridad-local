services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_FLASH_ATTENTION=1
      - OLLAMA_CONTEXT_LENGTH=8192
    deploy:
      resources:
        limits:
          memory: 20G
        reservations:
          memory: 8G

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      - ollama
    volumes:
      - ./Modelfile:/Modelfile
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sleep 10
        echo "Descargando modelo base..."
        ollama pull qwen2.5-coder:7b
        echo "Descargando modelo de embeddings nomic-embed-text..."
        ollama pull nomic-embed-text
        echo "Creando modelo auditor-seguridad desde Modelfile..."
        ollama create auditor-seguridad -f /Modelfile
        echo "Modelos listos."
    environment:
      - OLLAMA_HOST=ollama:11434
    deploy:
      resources:
        limits:
          memory: 20G
        reservations:
          memory: 4G

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    volumes:
      - chromadb_data:/chroma/chroma
    ports:
      - "8001:8000"
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ── MongoDB (NoSQL para vulnerabilidades) ───────────
  mongodb:
    image: mongo:7
    container_name: mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: seguridad_local_pass
      MONGO_INITDB_DATABASE: vulnerabilidades

  # ── PostgreSQL (Open WebUI + validación) ────────────
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    environment:
      POSTGRES_DB: openwebui
      POSTGRES_USER: openwebui
      POSTGRES_PASSWORD: openwebui_pass

  # ── Redis (cola Celery) ─────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  # ── Celery Worker ──────────────────────────────────
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: celery-worker
    restart: unless-stopped
    depends_on:
      - redis
      - ollama
      - chromadb
      - mongodb
      - postgres
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - OLLAMA_API_URL=http://ollama:11434/api
      - OLLAMA_BASE_URL=http://ollama:11434
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MONGO_URI=mongodb://admin:seguridad_local_pass@mongodb:27017/vulnerabilidades?authSource=admin
      - DB_URL=postgresql://openwebui:openwebui_pass@postgres:5432/openwebui
      - API_KEY_SALT=${API_KEY_SALT:-cambiar_esto_salt_seguro_por_favor}
    deploy:
      replicas: 1

  # ── Validation Service (middleware de seguridad) ────
  validation-service:
    build:
      context: .
      dockerfile: Dockerfile.validation
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - postgres
      - ollama
      - chromadb
      - mongodb
    environment:
      - DB_URL=postgresql://openwebui:openwebui_pass@postgres:5432/openwebui
      - OLLAMA_API_URL=http://ollama:11434/api
      - CHROMA_HOST=chromadb
      - CHROMA_PORT=8000
      - MONGO_URI=mongodb://admin:seguridad_local_pass@mongodb:27017/vulnerabilidades?authSource=admin
      - EMBED_SINGLE_TIMEOUT=300
      - EMBEDDING_MODEL=nomic-embed-text
      - ANALYZER_MODEL=auditor-seguridad
      - LLM_NUM_CTX=8192
      - LLM_TEMPERATURE=0.1
      - API_KEY_SALT=${API_KEY_SALT:-cambiar_esto_salt_seguro_por_favor}
      - CORS_ORIGINS=http://localhost:3000,https://seguridad.local
      - ENRICH_INTERNAL_TOKEN=${ENRICH_INTERNAL_TOKEN:-insecure-change-me}
    deploy:
      replicas: 1

  # ── Dashboard Service (frontend web) ──────────────
  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8000"
    depends_on:
      - postgres
      - mongodb
    environment:
      - DB_URL=postgresql://openwebui:openwebui_pass@postgres:5432/openwebui
      - MONGO_URI=mongodb://admin:seguridad_local_pass@mongodb:27017/vulnerabilidades?authSource=admin
      - API_KEY_SALT=${API_KEY_SALT:-cambiar_esto_salt_seguro_por_favor}
      - JWT_SECRET=${JWT_SECRET:-cambiar_esto_jwt_secret}
      - CORS_ORIGINS=http://localhost:3000,http://localhost:5173,https://seguridad.local

  # ── React Dashboard (SPA frontend) ─────────────────
  dashboard-react:
    build:
      context: ./dashboard-react
      dockerfile: Dockerfile
    container_name: dashboard-react
    restart: unless-stopped
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - dashboard
    environment:
      - VITE_API_URL=http://localhost:8002/api/v2

  # ── Open WebUI ────────────────────────────────────
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile.openwebui
    container_name: open-webui
    depends_on:
      - ollama
      - postgres
    ports:
      - "127.0.0.1:3000:8080"
    volumes:
      - open-webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DEFAULT_MODELS=auditor-seguridad:latest
      - DATABASE_URL=postgresql://openwebui:openwebui_pass@postgres:5432/openwebui
      - DB_URL=postgresql://openwebui:openwebui_pass@postgres:5432/openwebui
      - API_KEY_SALT=${API_KEY_SALT:-cambiar_esto_salt_seguro_por_favor}
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-auditor-seguridad-local-key-change-in-production}
      - ENRICH_INTERNAL_TOKEN=${ENRICH_INTERNAL_TOKEN:-insecure-change-me}
      - ENRICH_TIMEOUT=120

      # ── SMTP / Google SMTP ──────────────────────────
      - SMTP_SERVER=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_USERNAME=
      - SMTP_PASSWORD=
      - SMTP_EMAIL=
      - SMTP_USE_TLS=true

volumes:
  ollama_data:
  open-webui_data:
  chromadb_data:
  mongodb_data:
  postgres_data:
  redis_data:
