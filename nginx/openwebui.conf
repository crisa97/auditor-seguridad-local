# ============================================================================
# openwebui.conf — Nginx reverse proxy para Open WebUI + Validation Service
# ============================================================================
# Instalar en: /etc/nginx/sites-available/openwebui
# Habilitar con: ln -s /etc/nginx/sites-available/openwebui /etc/nginx/sites-enabled/
# ============================================================================

upstream openwebui_backend {
    server 127.0.0.1:8080;
}

upstream validation_backend {
    server 127.0.0.1:8000;
}

upstream dashboard_backend {
    server 127.0.0.1:8001;
}

# ── Ocultar versión de Nginx ──────────────────────────────────────────
server_tokens off;

# ── Rate limiting ──────────────────────────────────────────────────────
limit_req_zone $binary_remote_addr zone=webui_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=20r/s;

# ── Redirigir HTTP → HTTPS ────────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name seguridad.local;

    # Let's Encrypt (descomentar cuando se tenga el dominio)
    # location /.well-known/acme-challenge/ {
    #     root /var/www/html;
    # }

    location / {
        return 301 https://$server_name$request_uri;
    }
}

# ── Servidor HTTPS ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name seguridad.local;

    # ── SSL ──────────────────────────────────────────────────────────
    # Para autofirmado (pruebas):
    ssl_certificate     /etc/nginx/ssl/seguridad.local.crt;
    ssl_certificate_key /etc/nginx/ssl/seguridad.local.key;

    # Para Let's Encrypt (producción):
    # ssl_certificate     /etc/letsencrypt/live/seguridad.local/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/seguridad.local/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # ── Headers de seguridad ─────────────────────────────────────────
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws: wss:" always;

    proxy_hide_header X-Powered-By;
    proxy_hide_header Server;

    # ── Logs rotados ─────────────────────────────────────────────────
    access_log /var/log/nginx/openwebui_access.log;
    error_log  /var/log/nginx/openwebui_error.log;

    # ── API de validación (v1 + v2 rag) ─────────────────────────────────
    location /api/v1/ {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://validation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 30s;
    }

    location /api/v2/rag/ {
        limit_req zone=api_limit burst=5 nodelay;

        proxy_pass http://validation_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 600s;
        proxy_send_timeout 30s;
    }

    # ── Dashboard API (v2) ──────────────────────────────────────────
    location /api/v2/ {
        limit_req zone=api_limit burst=10 nodelay;

        proxy_pass http://dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # ── Dashboard Frontend ──────────────────────────────────────────
    location /dashboard/ {
        proxy_pass http://dashboard_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 30s;
    }

    # ── Open WebUI ───────────────────────────────────────────────────
    location / {
        limit_req zone=webui_limit burst=20 nodelay;

        proxy_pass http://openwebui_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Open WebUI usa WebSockets)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $http_connection;

        # Timeouts
        proxy_connect_timeout 10s;
        proxy_read_timeout 86400s;  # 24h para WebSockets
        proxy_send_timeout 30s;

        # Buffers
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # ── Denegar acceso a rutas sensibles ─────────────────────────────
    location ~ /\.(git|env|svn|htaccess) {
        deny all;
        return 404;
    }

    location ~ /(vendor|node_modules|__pycache__) {
        deny all;
        return 404;
    }
}
